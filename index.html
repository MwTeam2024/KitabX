*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:none;-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none;width:0;height:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%}
button,.hdr,.scr-scroll,.bottomnav{touch-action:manipulation}
body{font-family:var(--font-body);color:var(--outer-text);
  background:radial-gradient(circle at 1px 1px, var(--line-outer) 1px, transparent 1.6px) 0 0/22px 22px, var(--bg-outer);
  min-height:100vh;display:flex;flex-direction:column;align-items:center}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}
.ic svg{width:100%;height:100%;display:block}
.ic{display:inline-flex;flex-shrink:0;width:18px;height:18px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ===== outer chrome ===== */
.topbar{width:100%;display:flex;justify-content:center;border-bottom:1px solid var(--line-outer);background:var(--outer-surface)}
.topbar-in{width:min(1180px,94vw);display:flex;align-items:center;justify-content:space-between;padding:16px 4px;gap:14px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand-mark{font-family:var(--font-display);font-weight:700;font-size:21px;color:var(--outer-text)}
.brand-logo{display:inline-block;background-image:var(--logo-img);background-repeat:no-repeat;background-position:left center;background-size:contain;height:24px;aspect-ratio:1046/382;vertical-align:middle}
.brand-mark .bx{display:inline-flex;align-items:center;font-size:1.15em;margin-left:1px}
.brand-tag{font-family:var(--font-body);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--outer-muted)}
.topbar-actions{display:flex;gap:8px;flex-wrap:wrap}
.ghost-btn{padding:9px 16px;border-radius:999px;border:1px solid var(--line-outer);background:transparent;color:var(--outer-text);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.ghost-btn:hover{background:var(--line-outer)}
.ghost-btn .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.stage{width:min(1180px,94vw);flex:1;display:flex;gap:34px;padding:34px 4px 60px;align-items:flex-start;justify-content:center}
.stage-note{max-width:230px;position:sticky;top:24px;display:none}
@media(min-width:980px){.stage-note{display:block}}
.stage-note h3{font-family:var(--font-display);font-size:17px;margin-bottom:8px}
.stage-note p{font-size:12.5px;line-height:1.65;color:var(--outer-muted);margin-bottom:14px}
.stage-note .idx-link{display:block;font-size:12px;color:var(--outer-text);padding:6px 0;border:none;background:none;border-bottom:1px dashed var(--line-outer);text-align:left;width:100%}
.stage-note .idx-link b{color:var(--gold-deep)}

/* ===== phone ===== */
.phone-shell{width:min(390px,90vw);flex-shrink:0;position:relative}
.phone-shell::before{content:"";position:absolute;inset:-10% -22% -6%;background:radial-gradient(ellipse at 50% 38%, rgba(31,122,70,.32), transparent 68%);filter:blur(34px);z-index:-1;pointer-events:none}
.phone{position:relative;width:100%;aspect-ratio:390/824;border-radius:44px;background:#10140F;padding:12px;box-shadow:0 30px 60px rgba(0,0,0,.35);animation:phoneIn .6s cubic-bezier(.2,.8,.2,1)}
@keyframes phoneIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.phone-screen{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:var(--cream);color:var(--text)}
.notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#10140F;border-radius:14px;z-index:1000}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:120px;height:4px;background:rgba(255,255,255,.5);border-radius:3px;z-index:1000}
#screens{position:absolute;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;overflow:hidden;display:none;background:var(--cream)}
.screen.active{display:flex;flex-direction:column;animation:screenIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.scr-scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;min-height:0;-webkit-overflow-scrolling:touch}
.pad-nav{padding-bottom:20px}
.statusbar{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12px;color:#fff;flex-shrink:0;font-weight:600}
.statusbar.on-cream{color:var(--text)}

/* ===== header (curved green) ===== */
.hdr{background:linear-gradient(165deg,#1B5E37 0%, var(--brand) 55%, var(--brand-deep) 150%);border-radius:0 0 26px 26px;padding:8px 16px 30px;flex-shrink:0;position:relative;overflow:hidden}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo-badge{background-color:#fff;background-image:var(--logo-img);background-repeat:no-repeat;background-position:center;background-size:contain;border-radius:13px;padding:6px 11px;height:34px;aspect-ratio:1046/382;box-shadow:var(--shadow-sm);flex-shrink:0}
.logo-badge .lx{display:inline-flex;align-items:center;font-size:1.2em;margin-left:1px}
.lx-svg{width:0.82em;height:0.82em;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.logo-badge .lleaf{position:absolute;top:-3px;left:15px;font-size:10px;transform:rotate(-20deg)}
.hdr-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.credit-pill{background:linear-gradient(160deg,#F0BB3D,var(--gold-deep));border-radius:999px;padding:5px 12px 5px 5px;display:flex;align-items:center;gap:6px;color:#fff;font-size:12.5px;font-weight:700;box-shadow:var(--shadow-sm)}
.credit-num{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-size:11px}
.circle-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);border:none;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.circle-btn .ic{width:17px;height:17px}
.circle-btn .ping{position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:var(--sindoor);border:1.5px solid var(--brand)}
.avatar-chip{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--brand);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:12.5px;flex-shrink:0}
.hdr-title{color:#fff;font-family:var(--font-display);font-size:17px;font-weight:700;flex:1}
.hdr-sub{color:rgba(255,255,255,.62);font-size:11.5px;margin-top:1px}
.loc-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:999px;padding:7px 13px;color:#fff;font-size:12.5px;font-weight:600;margin-top:12px}
.loc-pill .ic{width:13px;height:13px}
.search-wrap{position:relative;margin-top:10px}
.search-input{width:100%;padding:11px 40px 11px 38px;border-radius:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.16);color:#fff;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.search-input::placeholder{color:rgba(255,255,255,.55)}
.search-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:rgba(255,255,255,.7)}
.search-filt{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:rgba(255,255,255,.7)}
.step-label{color:rgba(255,255,255,.75);font-size:11.5px;font-weight:600;margin:8px 0 8px}
.step-bar{height:5px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.step-bar i{display:block;height:100%;background:#fff;border-radius:4px}

/* ===== body basics ===== */
.px16{padding-left:16px;padding-right:16px}
.section-h{font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--text);position:relative;padding-bottom:6px;display:inline-block}
.section-h.tick::after{content:"";position:absolute;left:0;bottom:0;width:26px;height:3px;border-radius:3px;background:var(--brand-2)}
.section-row{display:flex;align-items:baseline;justify-content:space-between;padding:16px 16px 4px}
.section-sub{font-size:12.5px;color:var(--text-muted)}
.link-green{color:var(--brand-2);font-size:12.5px;font-weight:700;background:none;border:none;display:inline-flex;align-items:center;gap:4px}

.radius-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px}
.radius-l{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text);font-weight:600}
.radius-l .ic{width:14px;height:14px;color:var(--sindoor)}
.stepper{display:flex;align-items:center;gap:10px}
.step-circ{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--brand);font-size:14px}
.step-val{font-weight:700;font-size:13.5px;color:var(--text)}

.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:12px 16px 4px}
.stat-tile{background:var(--surface);border-radius:14px;padding:12px 4px 10px;text-align:center;box-shadow:var(--shadow-sm)}
.stat-ic{width:30px;height:30px;border-radius:50%;background:var(--mint);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;color:var(--brand-2)}
.stat-ic .ic{width:15px;height:15px}
.stat-num{font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--text)}
.stat-lbl{font-size:9.5px;color:var(--text-muted);margin-top:1px}
.stat-tile::after{content:"";display:block;width:16px;height:2px;background:var(--brand-2);border-radius:2px;margin:6px auto 0;opacity:.55}

.chiprow{display:flex;gap:8px;padding:12px 16px 4px;overflow-x:auto;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}
.chip{flex-shrink:0;padding:8px 15px;border-radius:999px;font-size:12.5px;font-weight:600;border:1.4px solid var(--line);color:var(--text);background:var(--surface)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.chip.circ{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chip.circ .ic{width:15px;height:15px;color:var(--brand)}

/* book cover */
.bcov{position:relative;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:12% 8%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.bcov-emblem{font-size:1.6em;margin-bottom:8%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.bcov-title{font-family:var(--font-display);font-weight:700;color:#F3E7C9;font-size:.92em;line-height:1.2;text-transform:uppercase;letter-spacing:.02em}
.bcov-author{font-size:.6em;color:rgba(255,255,255,.62);margin-top:6%;letter-spacing:.02em}

/* large book-detail cover: author top, emblem, title, subtitle, mark */
.bcov-detail{position:relative;border-radius:9px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;text-align:center;padding:9% 9% 8%}
